<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qadam Delivery</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="page">
    <aside class="promo-card">
      <div class="promo-plate">
        <p class="pill">Issiq &amp; mazali</p>
        <h1>Qadam menyusi</h1>
        <p class="promo-copy">
          Tez yetkazib berish, bir xil menyu vaqti‑soati bilan.
        </p>
        <div class="promo-qr">
          <div class="qr-placeholder">QR</div>
          <div class="promo-meta">
            <span>Bot orqali buyurtma</span>
            <small>@deliveringbotliqibot</small>
          </div>
        </div>
      </div>
    </aside>
    <main class="content">
      <header class="content-head">
        <div>
          <p class="eyebrow">Bugungi tanlov</p>
          <h2>Menyu</h2>
        </div>
        <div class="lang-switch">
          <a class="ghost-btn" id="orders-link" href="/my-orders">My Orders</a>
          <a class="ghost-btn" id="admin-link" href="/admin">Admin</a>
          <button class="ghost-btn">Uz</button>
          <button class="ghost-btn ghost-active">Ru</button>
          <button class="ghost-btn">En</button>
        </div>
      </header>

      <section class="hero" id="hero">
        <div class="hero-media" id="hero-media"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <p class="hero-eyebrow">Restoran vitrinasi</p>
          <h3 id="hero-title">Qadam</h3>
          <p id="hero-desc" class="hero-desc">Mazali taomlar va tez yetkazib berish.</p>
          <button class="ghost-btn hero-btn" id="hero-cta" type="button">Смотреть меню</button>
        </div>
      </section>

      <section>
        <div id="menu" class="menu-grid"></div>
      </section>
    </main>
    <aside class="cart-pane">
      <div class="cart-head">
        <div>
          <p class="section-title">Savat</p>
          <small class="muted">Buyurtmani shu yerda yakunlang</small>
        </div>
        <button id="clear-cart" class="ghost-btn" type="button">Tozalash</button>
      </div>
      <div class="cart-body">
        <div id="cart-empty" class="muted">Hozircha bo'sh.</div>
        <ul id="cart-list" class="cart-list"></ul>
      </div>
      <p id="cart-total" class="total-line"></p>
      <form id="order-form" class="form">
        <div class="grid-two">
          <div class="field">
            <label>Ism</label>
            <input name="name" autocomplete="name" required />
          </div>
          <div class="field">
            <label>Telefon</label>
            <input name="phone" autocomplete="tel" required />
          </div>
        </div>
        <div class="field">
          <label>Manzil</label>
          <textarea name="address" autocomplete="street-address" required></textarea>
        </div>
        <div class="field">
          <label>Izoh (ixtiyoriy)</label>
          <textarea name="comment" placeholder="-"></textarea>
        </div>
        <button type="submit" id="submit-order">Yuborish</button>
        <p id="order-status" class="muted status"></p>
      </form>
    </aside>
  </div>
  <script>
    const menuEl = document.getElementById("menu");
    const cartList = document.getElementById("cart-list");
    const cartEmpty = document.getElementById("cart-empty");
    const cartTotal = document.getElementById("cart-total");
    const clearBtn = document.getElementById("clear-cart");
    const orderForm = document.getElementById("order-form");
    const submitBtn = document.getElementById("submit-order");
    const statusEl = document.getElementById("order-status");
    const heroTitle = document.getElementById("hero-title");
    const heroDesc = document.getElementById("hero-desc");
    const heroMedia = document.getElementById("hero-media");
    const heroCta = document.getElementById("hero-cta");
    const ordersLink = document.getElementById("orders-link");
    const adminLink = document.getElementById("admin-link");

    const cart = new Map();
    let menuCache = null;
    let promotions = [];
    let discountPercent = 0;
    let tenantPlan = "basic";
    const tenantSlug = new URLSearchParams(window.location.search).get("tenant");

    const tenantPath = (path) => (tenantSlug ? `/t/${tenantSlug}${path}` : path);
    if (ordersLink && tenantSlug) {
      ordersLink.href = `/my-orders?tenant=${encodeURIComponent(tenantSlug)}`;
    }
    if (adminLink && tenantSlug) {
      adminLink.href = `/admin?tenant=${encodeURIComponent(tenantSlug)}`;
    }

    const formatPrice = (n) => `${Number(n || 0).toLocaleString("ru-RU")} so'm`;
    const effectivePrice = (price) => {
      if (!discountPercent) return Number(price || 0);
      return Math.round((Number(price || 0) * (100 - discountPercent)) / 100);
    };

    async function loadTenant() {
      const res = await fetch(tenantPath("/tenant"), { credentials: "same-origin" });
      if (!res.ok) return;
      const data = await res.json();
      tenantPlan = data.plan || "basic";
      if (data.name) heroTitle.textContent = data.name;
      if (data.description) heroDesc.textContent = data.description;
      if (data.hero_image) {
        heroMedia.style.backgroundImage = `url("${data.hero_image}")`;
        heroMedia.classList.remove("hero-fallback");
      } else {
        heroMedia.classList.add("hero-fallback");
      }
      if (tenantPlan === "basic") {
        if (ordersLink) ordersLink.style.display = "none";
        if (adminLink) adminLink.style.display = "none";
      }
    }

    async function loadMenu() {
      const res = await fetch(tenantPath("/menu"), { credentials: "same-origin" });
      if (!res.ok) throw new Error("Menu yuklab bo'lmadi");
      const data = await res.json();
      menuCache = data;
      renderMenu(data.categories || []);
    }

    async function loadPromotions() {
      if (tenantPlan === "basic") return;
      const url = tenantSlug ? `/api/promotions?tenant=${encodeURIComponent(tenantSlug)}` : "/api/promotions";
      const res = await fetch(url, { credentials: "same-origin" });
      if (!res.ok) return;
      const data = await res.json();
      promotions = data.items || [];
      discountPercent = promotions
        .filter((p) => p.type === "happy_hours" && p.discount_percent)
        .reduce((acc, p) => Math.max(acc, p.discount_percent), 0);
    }

    function safeText(el, text) {
      el.textContent = text ?? "";
      return el;
    }

    function renderMenu(categories) {
      menuEl.innerHTML = "";
      categories.forEach((cat) => {
        (cat.items || []).forEach((item) => {
          const card = document.createElement("div");
          card.className = "menu-card";

          // Optional badge for categories that contain special words
          if (cat.title && cat.title.toLowerCase().includes("maxs")) {
            const badge = document.createElement("div");
            badge.className = "badge-green";
            safeText(badge, "100% tabiy");
            card.appendChild(badge);
          }
          const itemPromo = promotions.find(
            (p) => p.type === "item_of_the_day" && String(p.product_id) === String(item.id)
          );
          if (itemPromo) {
            const badge = document.createElement("div");
            badge.className = "badge-promo";
            safeText(badge, "Item of the day");
            card.appendChild(badge);
          }
          if (discountPercent) {
            const badge = document.createElement("div");
            badge.className = "badge-promo-alt";
            safeText(badge, `Happy hours -${discountPercent}%`);
            card.appendChild(badge);
          }

          const imageWrap = document.createElement("div");
          imageWrap.className = "menu-item-image";
          if (item.image_url) {
            const img = document.createElement("img");
            img.src = item.image_url;
            img.alt = item.name || "";
            img.loading = "lazy";
            imageWrap.appendChild(img);
          } else {
            const img = document.createElement("div");
            img.className = "img-placeholder";
            safeText(img, item.name || "");
            imageWrap.appendChild(img);
          }
          card.appendChild(imageWrap);

          const title = document.createElement("h4");
          safeText(title, item.name);
          card.appendChild(title);

          const desc = document.createElement("p");
          safeText(desc, item.description || "");
          card.appendChild(desc);

          const priceRow = document.createElement("div");
          priceRow.className = "price-row";
          const price = document.createElement("div");
          price.className = "price";
          const displayPrice = effectivePrice(item.price);
          safeText(price, formatPrice(displayPrice));
          if (discountPercent) {
            const note = document.createElement("div");
            note.className = "promo-note";
            safeText(note, `Old: ${formatPrice(item.price)}`);
            price.appendChild(note);
          }
          const btn = document.createElement("button");
          btn.className = "add-btn";
          btn.type = "button";
          safeText(btn, "+");
          btn.addEventListener("click", () => addToCart(item));
          priceRow.appendChild(price);
          priceRow.appendChild(btn);
          card.appendChild(priceRow);

          menuEl.appendChild(card);
        });
      });
    }

    function addToCart(item) {
      const current = cart.get(item.id) || { item, qty: 0 };
      current.qty += 1;
      cart.set(item.id, current);
      renderCart();
    }

    function updateQty(id, delta) {
      const current = cart.get(id);
      if (!current) return;
      current.qty += delta;
      if (current.qty <= 0) cart.delete(id);
      else cart.set(id, current);
      renderCart();
    }

    function clearCart() {
      cart.clear();
      renderCart();
    }

    function renderCart() {
      cartList.innerHTML = "";
      const items = Array.from(cart.values());
      if (!items.length) {
        cartEmpty.style.display = "block";
        cartTotal.textContent = "";
        return;
      }
      cartEmpty.style.display = "none";

      let total = 0;
      items.forEach(({ item, qty }) => {
        const li = document.createElement("li");
        li.className = "cart-item";
        const lineTotal = effectivePrice(item.price) * qty;
        total += lineTotal;
        const left = document.createElement("span");
        safeText(left, `${item.name} x${qty}`);
        const right = document.createElement("span");
        safeText(right, formatPrice(lineTotal));
        li.appendChild(left);
        li.appendChild(right);
        li.addEventListener("click", () => updateQty(item.id, -1));
        cartList.appendChild(li);
      });
      cartTotal.textContent = "Jami: " + formatPrice(total);
    }

    async function submitOrder(evt) {
      evt.preventDefault();
      statusEl.textContent = "";
      if (!cart.size) {
        statusEl.textContent = "Savat bo'sh. Avval menyudan qo'shing.";
        return;
      }
      submitBtn.disabled = true;
      try {
        const form = new FormData(orderForm);
        const payload = {
          items: Array.from(cart.values()).map(({ item, qty }) => ({ item_id: item.id, qty })),
          customer: {
            name: (form.get("name") || "").trim(),
            phone: (form.get("phone") || "").trim(),
            address: (form.get("address") || "").trim(),
            comment: (form.get("comment") || "-").trim() || "-",
          },
          source: "site",
        };
        const res = await fetch("/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          credentials: "same-origin",
        });
        if (!res.ok) throw new Error("Yuborishda xatolik");
        const data = await res.json();
        statusEl.textContent = `Buyurtma qabul qilindi: #${data.order_id}`;
        clearCart();
        orderForm.reset();
      } catch (err) {
        statusEl.textContent = err.message || "Xatolik";
      } finally {
        submitBtn.disabled = false;
      }
    }

    clearBtn.addEventListener("click", clearCart);
    orderForm.addEventListener("submit", submitOrder);
    heroCta.addEventListener("click", () => {
      document.getElementById("menu").scrollIntoView({ behavior: "auto" });
    });

    loadTenant().catch(() => {});
    loadPromotions().catch(() => {}).finally(() => {
      loadMenu().catch((e) => {
        menuEl.innerHTML = `<p class="muted">${e.message}</p>`;
      });
    });
  </script>
</body>
</html>
