<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Analytics | Qadam</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="page single">
    <main class="content">
      <header class="content-head">
        <div>
          <p class="eyebrow">Admin</p>
          <h2>Analytics</h2>
        </div>
        <div class="lang-switch">
          <button class="ghost-btn" data-range="today">Today</button>
          <button class="ghost-btn ghost-active" data-range="7d">Last 7d</button>
          <button class="ghost-btn" data-range="30d">Last 30d</button>
        </div>
      </header>

      <section class="analytics-grid" id="analytics">
        <div class="stat-card">
          <p class="muted">Orders</p>
          <h3 id="stat-orders">0</h3>
        </div>
        <div class="stat-card">
          <p class="muted">Revenue</p>
          <h3 id="stat-revenue">0</h3>
        </div>
        <div class="stat-card">
          <p class="muted">Average check</p>
          <h3 id="stat-avg">0</h3>
        </div>
      </section>

      <section class="orders-panel">
        <h3>Top items</h3>
        <table class="analytics-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Revenue</th>
            </tr>
          </thead>
          <tbody id="top-items"></tbody>
        </table>
        <p id="analytics-status" class="muted status"></p>
      </section>

      <section class="orders-panel">
        <header class="content-head">
          <div>
            <p class="eyebrow">Branding</p>
            <h2>Restaurant profile</h2>
          </div>
        </header>
        <form id="branding-form" class="form">
          <div class="grid-two">
            <div class="field">
              <label for="brand-logo">Logo URL/path</label>
              <input id="brand-logo" placeholder="/uploads/demo/logo.png" />
            </div>
            <div class="field">
              <label for="brand-theme">Theme mode</label>
              <select id="brand-theme">
                <option value="default">Default</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </div>
          </div>
          <div class="grid-two">
            <div class="field">
              <label for="brand-primary">Primary color</label>
              <div class="color-control">
                <input id="brand-primary" type="color" value="#172033" />
                <span id="brand-primary-value" class="color-value">#172033</span>
              </div>
            </div>
            <div class="field">
              <label for="brand-accent">Accent color</label>
              <div class="color-control">
                <input id="brand-accent" type="color" value="#d6ad68" />
                <span id="brand-accent-value" class="color-value">#d6ad68</span>
              </div>
            </div>
          </div>
          <label class="checkbox-row">
            <input id="brand-use-default-colors" type="checkbox" checked />
            <span>Use default colors</span>
          </label>
          <button type="submit">Save branding</button>
          <p id="branding-status" class="muted status"></p>
        </form>
      </section>

      <section class="orders-panel">
        <header class="content-head">
          <div>
            <p class="eyebrow">Promotions</p>
            <h2>Manage</h2>
          </div>
          <div class="menu-admin-nav">
            <a class="ghost-btn button-link" id="menu-manager-link" href="/">Manage menu</a>
            <a class="ghost-btn button-link" id="back-to-menu" href="/">Back to menu</a>
          </div>
        </header>

        <form id="promo-form" class="form">
          <div class="grid-two">
            <div class="field">
              <label>Type</label>
              <select id="promo-type">
                <option value="item_of_the_day">Item of the day</option>
                <option value="happy_hours">Happy hours</option>
              </select>
            </div>
            <div class="field">
              <label>Product ID (optional)</label>
              <input id="promo-product" placeholder="Menu item id" />
            </div>
          </div>
          <div class="grid-two">
            <div class="field">
              <label>Discount %</label>
              <input id="promo-discount" type="number" min="0" max="100" />
            </div>
            <div class="field">
              <label>Days of week (0-6, comma)</label>
              <input id="promo-days" placeholder="1,2,3,4,5" />
            </div>
          </div>
          <div class="grid-two">
            <div class="field">
              <label>Start time</label>
              <input id="promo-start" type="time" />
            </div>
            <div class="field">
              <label>End time</label>
              <input id="promo-end" type="time" />
            </div>
          </div>
          <button type="submit">Create promotion</button>
          <p id="promo-status" class="muted status"></p>
        </form>

        <div id="promo-list" class="orders-list"></div>
      </section>
    </main>
  </div>

  <script>
    const tenantSlug = decodeURIComponent(window.location.pathname.split("/")[2] || "");
    const initialParams = new URLSearchParams(window.location.search);
    const adminToken = initialParams.get("admin_token");
    const tenantRequiredError = "Tenant slug required. Open page as /t/<slug>/admin";
    const accessDeniedError = "Access denied. Open the admin link from Telegram again or request a new admin login link.";
    let adminAccessDenied = false;

    const tenantPath = (path) => {
      if (!tenantSlug) throw new Error(tenantRequiredError);
      return `/t/${encodeURIComponent(tenantSlug)}${path}`;
    };

    const backLink = document.getElementById("back-to-menu");
    const menuManagerLink = document.getElementById("menu-manager-link");
    const cleanedParams = new URLSearchParams(window.location.search);
    cleanedParams.delete("admin_token");
    if (backLink && tenantSlug) {
      backLink.href = `/t/${encodeURIComponent(tenantSlug)}`;
    }
    if (menuManagerLink && tenantSlug) {
      const suffix = cleanedParams.toString() ? `?${cleanedParams.toString()}` : "";
      menuManagerLink.href = `/admin/menu/${encodeURIComponent(tenantSlug)}${suffix}`;
    }

    const ordersEl = document.getElementById("stat-orders");
    const revenueEl = document.getElementById("stat-revenue");
    const avgEl = document.getElementById("stat-avg");
    const topItemsEl = document.getElementById("top-items");
    const analyticsStatus = document.getElementById("analytics-status");
    const brandingForm = document.getElementById("branding-form");
    const brandingStatus = document.getElementById("branding-status");
    const brandLogo = document.getElementById("brand-logo");
    const brandPrimary = document.getElementById("brand-primary");
    const brandAccent = document.getElementById("brand-accent");
    const brandPrimaryValue = document.getElementById("brand-primary-value");
    const brandAccentValue = document.getElementById("brand-accent-value");
    const brandTheme = document.getElementById("brand-theme");
    const brandUseDefaultColors = document.getElementById("brand-use-default-colors");

    const promoForm = document.getElementById("promo-form");
    const promoStatus = document.getElementById("promo-status");
    const promoList = document.getElementById("promo-list");

    const formatPrice = (n) => `${Number(n || 0).toLocaleString("ru-RU")} so'm`;

    function showAdminAccessDenied() {
      adminAccessDenied = true;
      analyticsStatus.textContent = accessDeniedError;
      brandingStatus.textContent = accessDeniedError;
      promoStatus.textContent = accessDeniedError;
      brandingForm.querySelectorAll("input, select, button").forEach((control) => {
        control.disabled = true;
      });
      promoForm.querySelectorAll("input, select, button").forEach((control) => {
        control.disabled = true;
      });
      promoList.innerHTML = "";
    }

    function replaceUrlWithoutAdminToken() {
      const url = new URL(window.location.href);
      url.searchParams.delete("admin_token");
      const nextQuery = url.searchParams.toString();
      const nextUrl = nextQuery ? `${url.pathname}?${nextQuery}` : url.pathname;
      window.history.replaceState({}, "", nextUrl);
    }

    async function bootstrapAdminAuth() {
      if (!tenantSlug) {
        analyticsStatus.textContent = tenantRequiredError;
        brandingStatus.textContent = tenantRequiredError;
        promoStatus.textContent = tenantRequiredError;
        return false;
      }
      if (!adminToken) {
        return true;
      }

      const res = await fetch("/admin/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ token: adminToken, slug: tenantSlug }),
      });
      if (!res.ok) {
        showAdminAccessDenied();
        return false;
      }
      replaceUrlWithoutAdminToken();
      return true;
    }

    async function loadAnalytics(range = "7d") {
      analyticsStatus.textContent = "";
      if (!tenantSlug) {
        analyticsStatus.textContent = tenantRequiredError;
        return;
      }
      const res = await fetch(`${tenantPath("/api/admin/analytics")}?range=${encodeURIComponent(range)}`, {
        credentials: "include",
      });
      if (res.status === 401) {
        showAdminAccessDenied();
        return;
      }
      if (res.status === 403) {
        analyticsStatus.textContent = "Analytics unavailable for current plan or admin access.";
        return;
      }
      if (!res.ok) {
        analyticsStatus.textContent = "Analytics yuklab bo'lmadi.";
        return;
      }
      const data = await res.json();
      ordersEl.textContent = data.orders || 0;
      revenueEl.textContent = formatPrice(data.revenue || 0);
      avgEl.textContent = formatPrice(data.average_check || 0);
      topItemsEl.innerHTML = "";
      (data.top_items || []).forEach((item) => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${item.name}</td><td>${item.qty}</td><td>${formatPrice(item.revenue)}</td>`;
        topItemsEl.appendChild(row);
      });
    }

    async function loadPromotions() {
      promoStatus.textContent = "";
      if (!tenantSlug) {
        promoStatus.textContent = tenantRequiredError;
        return;
      }
      const res = await fetch(tenantPath("/api/admin/promotions"), { credentials: "include" });
      if (res.status === 401) {
        showAdminAccessDenied();
        return;
      }
      if (res.status === 403) {
        promoStatus.textContent = "Promotions unavailable for current plan or admin access.";
        return;
      }
      if (!res.ok) {
        promoStatus.textContent = "Promolarni yuklab bo'lmadi.";
        return;
      }
      const data = await res.json();
      renderPromotions(data.items || []);
    }

    function renderPromotions(items) {
      promoList.innerHTML = "";
      if (!items.length) {
        promoList.innerHTML = '<p class="muted">Promo yo\'q</p>';
        return;
      }
      items.forEach((promo) => {
        const card = document.createElement("div");
        card.className = "orders-card";
        card.innerHTML = `
          <div class="orders-card-head">
            <div><strong>#${promo.id}</strong> · ${promo.type}</div>
            <span class="status-pill">${promo.is_active ? "Active" : "Inactive"}</span>
          </div>
          <div class="muted">Product: ${promo.product_id || "-"} | Discount: ${promo.discount_percent || 0}%</div>
          <div class="muted">Time: ${promo.start_time || "-"} - ${promo.end_time || "-"} | Days: ${(promo.days_of_week || []).join(", ")}</div>
        `;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = promo.is_active ? "Deactivate" : "Activate";
        btn.addEventListener("click", async () => {
          await updatePromo(promo.id, { is_active: !promo.is_active });
          await loadPromotions();
        });
        const footer = document.createElement("div");
        footer.className = "orders-card-foot";
        footer.appendChild(document.createElement("div"));
        footer.appendChild(btn);
        card.appendChild(footer);
        promoList.appendChild(card);
      });
    }

    async function updatePromo(id, payload) {
      const res = await fetch(tenantPath(`/api/admin/promotions/${id}`), {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(payload),
      });
      if (res.status === 401) {
        promoStatus.textContent = accessDeniedError;
      } else if (!res.ok) {
        promoStatus.textContent = "Promo yangilashda xatolik.";
      }
    }

    async function loadBranding(options = {}) {
      const preserveStatus = Boolean(options.preserveStatus);
      if (!preserveStatus) {
        brandingStatus.textContent = "";
      }
      if (adminAccessDenied) {
        brandingStatus.textContent = accessDeniedError;
        return;
      }
      if (!tenantSlug) {
        brandingStatus.textContent = tenantRequiredError;
        return;
      }
      const res = await fetch(tenantPath("/tenant"), { credentials: "include" });
      if (!res.ok) {
        brandingStatus.textContent = "Branding yuklab bo'lmadi.";
        return;
      }
      const data = await res.json();
      const hasPrimaryColor = /^#[0-9a-fA-F]{6}$/.test(data.primary_color || "");
      const hasAccentColor = /^#[0-9a-fA-F]{6}$/.test(data.accent_color || "");
      brandLogo.value = data.logo_url || "";
      brandPrimary.value = hasPrimaryColor ? data.primary_color : "#172033";
      brandAccent.value = hasAccentColor ? data.accent_color : "#d6ad68";
      brandTheme.value = ["default", "light", "dark"].includes(data.theme_mode) ? data.theme_mode : "default";
      brandUseDefaultColors.checked = !(hasPrimaryColor && hasAccentColor);
      syncBrandColorInputs();
    }

    function syncBrandColorInputs() {
      const disabled = brandUseDefaultColors.checked;
      brandPrimary.disabled = disabled;
      brandAccent.disabled = disabled;
      brandPrimaryValue.textContent = brandPrimary.value;
      brandAccentValue.textContent = brandAccent.value;
    }

    brandUseDefaultColors.addEventListener("change", syncBrandColorInputs);
    brandPrimary.addEventListener("input", syncBrandColorInputs);
    brandAccent.addEventListener("input", syncBrandColorInputs);

    brandingForm.addEventListener("submit", async (evt) => {
      evt.preventDefault();
      brandingStatus.textContent = "";
      if (!tenantSlug) {
        brandingStatus.textContent = tenantRequiredError;
        return;
      }

      const payload = {
        logo_url: brandLogo.value.trim() || null,
        primary_color: brandUseDefaultColors.checked ? null : (brandPrimary.value || null),
        accent_color: brandUseDefaultColors.checked ? null : (brandAccent.value || null),
        theme_mode: brandTheme.value || "default",
      };
      const res = await fetch(tenantPath("/api/admin/tenant"), {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(payload),
      });
      if (res.status === 401 || res.status === 403) {
        showAdminAccessDenied();
        return;
      }
      if (!res.ok) {
        const error = await res.json().catch(() => ({}));
        brandingStatus.textContent = error.detail || "Branding saqlanmadi.";
        return;
      }
      brandingStatus.textContent = "Branding saqlandi.";
      await loadBranding({ preserveStatus: true });
    });

    promoForm.addEventListener("submit", async (evt) => {
      evt.preventDefault();
      promoStatus.textContent = "";
      if (!tenantSlug) {
        promoStatus.textContent = tenantRequiredError;
        return;
      }

      const type = document.getElementById("promo-type").value;
      const productId = document.getElementById("promo-product").value;
      const discount = document.getElementById("promo-discount").value;
      const days = document.getElementById("promo-days").value;
      const start = document.getElementById("promo-start").value;
      const end = document.getElementById("promo-end").value;

      const payload = {
        type,
        product_id: productId ? Number(productId) : null,
        discount_percent: discount ? Number(discount) : null,
        days_of_week: days ? days.split(",").map((d) => Number(d.trim())).filter((d) => !Number.isNaN(d)) : null,
        start_time: start || null,
        end_time: end || null,
        is_active: true,
      };

      const res = await fetch(tenantPath("/api/admin/promotions"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(payload),
      });
      if (res.status === 401) {
        showAdminAccessDenied();
        return;
      }
      if (!res.ok) {
        promoStatus.textContent = "Promo yaratishda xatolik.";
        return;
      }
      promoStatus.textContent = "Promo yaratildi.";
      promoForm.reset();
      await loadPromotions();
    });

    document.querySelectorAll("[data-range]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-range]").forEach((b) => b.classList.remove("ghost-active"));
        btn.classList.add("ghost-active");
        loadAnalytics(btn.getAttribute("data-range"));
      });
    });

    async function boot() {
      const ok = await bootstrapAdminAuth();
      if (!ok) {
        return;
      }
      await loadBranding();
      await loadAnalytics("7d");
      if (adminAccessDenied) {
        return;
      }
      await loadPromotions();
    }

    boot();
  </script>
</body>
</html>
