<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders | Qadam</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="page single">
    <main class="content">
      <header class="content-head">
        <div>
          <p class="eyebrow">Shaxsiy</p>
          <h2>My Orders</h2>
        </div>
        <a class="ghost-btn" id="back-to-menu" href="/">Back to menu</a>
      </header>

      <section class="orders-panel">
        <div class="field">
          <label>Telefon raqami</label>
          <div class="orders-search">
            <input id="phone" autocomplete="tel" placeholder="+998 90 000 00 00" />
            <button id="load-orders" type="button">Yuklash</button>
          </div>
        </div>
        <p id="orders-status" class="muted status"></p>
        <div id="orders-list" class="orders-list"></div>
      </section>
    </main>
  </div>

  <script>
    const phoneInput = document.getElementById("phone");
    const loadBtn = document.getElementById("load-orders");
    const statusEl = document.getElementById("orders-status");
    const listEl = document.getElementById("orders-list");

    const tenantSlug = decodeURIComponent(window.location.pathname.split("/")[2] || "");
    const tenantRequiredError = "Tenant slug required. Open page as /t/<slug>/my-orders";
    const tenantPath = (path) => {
      if (!tenantSlug) throw new Error(tenantRequiredError);
      return `/t/${encodeURIComponent(tenantSlug)}${path}`;
    };

    const backLink = document.getElementById("back-to-menu");
    if (backLink && tenantSlug) {
      backLink.href = `/t/${encodeURIComponent(tenantSlug)}`;
    }

    const formatPrice = (n) => `${Number(n || 0).toLocaleString("ru-RU")} so'm`;
    const formatDate = (iso) => {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleString("ru-RU");
    };

    function renderOrders(items, phone) {
      listEl.innerHTML = "";
      if (!items.length) {
        listEl.innerHTML = '<p class="muted">Buyurtmalar topilmadi.</p>';
        return;
      }
      items.forEach((order) => {
        const card = document.createElement("div");
        card.className = "orders-card";

        const header = document.createElement("div");
        header.className = "orders-card-head";
        const headerText = document.createElement("div");
        const orderId = document.createElement("strong");
        orderId.textContent = `#${order.id}`;
        const orderDate = document.createElement("div");
        orderDate.className = "muted";
        orderDate.textContent = formatDate(order.created_at);
        headerText.appendChild(orderId);
        headerText.appendChild(orderDate);
        header.appendChild(headerText);

        const status = document.createElement("span");
        status.className = "status-pill";
        status.textContent = order.status || "NEW";
        header.appendChild(status);

        const itemsList = document.createElement("ul");
        itemsList.className = "orders-items";
        (order.items || []).forEach((it) => {
          const li = document.createElement("li");
          li.textContent = `${it.name} x${it.qty} · ${formatPrice(it.line_total)}`;
          itemsList.appendChild(li);
        });

        const footer = document.createElement("div");
        footer.className = "orders-card-foot";
        const total = document.createElement("div");
        total.textContent = `Jami: ${formatPrice(order.total)}`;
        footer.appendChild(total);

        card.appendChild(header);
        card.appendChild(itemsList);
        card.appendChild(footer);
        listEl.appendChild(card);
      });
    }

    async function loadOrders() {
      const phone = (phoneInput.value || "").trim();
      if (!phone) {
        statusEl.textContent = "Telefon raqamini kiriting.";
        return;
      }
      if (!tenantSlug) {
        statusEl.textContent = tenantRequiredError;
        return;
      }
      statusEl.textContent = "";
      loadBtn.disabled = true;
      try {
        const res = await fetch(`${tenantPath("/api/orders/history")}?phone=${encodeURIComponent(phone)}`);
        if (res.status === 403) {
          statusEl.textContent = "Buyurtmalar tarixi telefon raqamini tasdiqlash qo'shilgandan keyin ishlaydi.";
          listEl.innerHTML = "";
          return;
        }
        if (!res.ok) throw new Error("Buyurtmalarni yuklab bo'lmadi");
        const data = await res.json();
        renderOrders(data.items || [], phone);
      } catch (err) {
        statusEl.textContent = err.message || "Xatolik";
      } finally {
        loadBtn.disabled = false;
      }
    }

    loadBtn.addEventListener("click", loadOrders);
  </script>
</body>
</html>
